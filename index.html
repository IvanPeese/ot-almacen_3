2", "1H053", "1H054", "1G011", "1G012", "1G013", "1G014", "1G021", "1G022", "1G023", "1G024", "1G031", "1G032", "1G033", "1G034", "1G041", "1G042", "1G043", "1G044", "1G051", "1G052", "1G053", "1G054", "1F011", "1F012", "1F013", "1F014", "1F021", "1F022", "1F023", "1F024", "1F031", "1F032", "1F033", "1F034", "1F041", "1F042", "1F043", "1F044", "1F051", "1F052", "1F053", "1F054", "1E011", "1E012", "1E013", "1E014", "1E021", "1E022", "1E023", "1E024", "1E031", "1E032", "1E033", "1E034", "1D011", "1D012", "1C011", "1C012", "1C013", "1C014", "1C031", "1C032", "1C033", "1C034", "1C021", "1C022", "1C023", "1C024", "1B011", "1B012", "1B013", "1B014", "1B021", "1B022", "1B023", "1B024", "1B031", "1B032", "1B033", "1B034"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,S=null,tab='rev',cur={z:null,r:null,i:0},msgT=null,setup={zonas:{},raw:null,name:''},fqL='',fzL='',frL='',onlyPend=false;
/* ================= lectura del CSV ================= */
function decodeBuf(buf){let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}return t.replace(/^\uFEFF/,'')}
function parseCSV(text){const first=text.split(/\r?\n/,1)[0];const delim=first.split(';').length>=first.split(',').length?';':',';const rows=[];let row=[],c='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===delim){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(c);c='';rows.push(row);row=[]}else c+=ch}
  if(c!==''||row.length){row.push(c);rows.push(row)}return rows}
const LOC_RE=/([ABCDE])\s*([0-9]{2})\s*([0-9]{2})(?:\s*-\s*([0-9]{2}))?\s*([0-9])|(?:^|[^0-9A-Za-z])([1-9])([A-Z])\s?([0-9]{2})([0-9])(?![0-9])/g;
function extractLocs(str){const out=[];if(!str)return out;LOC_RE.lastIndex=0;let m;
  while((m=LOC_RE.exec(str))!==null){
    if(m[6]){out.push({z:m[6],r:m[7],m:m[8],n:m[9],code:m[6]+m[7]+m[8]+m[9]});continue}
    const c1=parseInt(m[3],10),c2=m[4]?parseInt(m[4],10):c1;
    for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++){const cc=String(c).padStart(2,'0');out.push({z:m[1],r:m[2],m:cc,n:m[5],code:m[1]+m[2]+cc+m[5]})}}
  return out}
function locSplit(code){ // para ubicaciones escritas a mano o del mapa
  let m=/^([1-9])([A-Z])([0-9]{2})([0-9])$/.exec(code);if(m)return{z:m[1],r:m[2],m:m[3],n:m[4],code};
  m=/^([A-E])([0-9]{2})([0-9]{2})([0-9])$/.exec(code);if(m)return{z:m[1],r:m[2],m:m[3],n:m[4],code};return null}
function analizarCSV(txt,name){
  const rows=parseCSV(txt);const h=(rows[0]||[]).map(x=>String(x||'').trim());const ix=n=>h.indexOf(n);
  const iC=ix('Codigo'),iD=ix('Descripcion'),iU=ix('UbicacionCodigo'),i1=ix('UbicacionCodigoAlt1'),i2=ix('UbicacionCodigoAlt2'),iE=ix('Existencias');
  if(iC<0||iU<0)throw new Error('No parece un Almacen_A.csv (faltan las columnas Codigo y UbicacionCodigo).');
  const locs={},cat=[];let nArt=0;
  for(let r=1;r<rows.length;r++){const x=rows[r];if(!x||!x[iC])continue;const cod=String(x[iC]).trim();if(!cod)continue;
    const desc=String(iD>=0?x[iD]||'':'').trim().slice(0,70);const ex=iE>=0?Math.round(parseFloat(String(x[iE]||'0').replace(',','.'))||0):0;nArt++;cat.push(cod+'\t'+desc);
    [[iU,'P'],[i1,'S'],[i2,'S']].forEach(([i,t])=>{if(i<0||!x[i])return;extractLocs(String(x[i])).forEach(l=>{
      const o=locs[l.code]||(locs[l.code]={z:l.z,r:l.r,m:l.m,n:l.n,a:[]});
      const e=o.a.find(a=>a[0]===cod);if(e){if(e[3].indexOf(t)<0)e[3]+=t}else o.a.push([cod,desc,ex,t])})})}
  const zonas={};Object.keys(locs).forEach(c=>{const z=locs[c].z;(zonas[z]||(zonas[z]={n:0,art:0}));zonas[z].n++;zonas[z].art+=locs[c].a.length});
  return{locs,cat,zonas,nArt,name}}
function crearDatos(an,zsel,conMapa){
  const locs={};Object.keys(an.locs).forEach(c=>{if(zsel.includes(an.locs[c].z))locs[c]=an.locs[c]});
  if(conMapa&&zsel.includes('1'))S1CODES.forEach(c=>{if(!locs[c]){const s=locSplit(c);if(s)locs[c]={z:s.z,r:s.r,m:s.m,n:s.n,a:[]}}});
  const where={};Object.keys(an.locs).forEach(c=>an.locs[c].a.forEach(a=>{(where[a[0]]||(where[a[0]]=[])).push(c)}));
  const now=new Date();const p=n=>String(n).padStart(2,'0');
  return{id:'VER-'+now.getFullYear()+p(now.getMonth()+1)+p(now.getDate())+'-'+p(now.getHours())+p(now.getMinutes()),fecha:p(now.getDate())+'/'+p(now.getMonth()+1)+'/'+now.getFullYear(),origen:an.name,zonas:zsel,locs,cat:an.cat.join('\n'),where}}
/* ================= modelo ================= */
const ZORD='1234567CDEAB';
const zname=z=>/[1-9]/.test(z)?'Sector '+z:'Zona '+z;
const rname=(z,r)=>/[1-9]/.test(z)?'Rack '+r:'Bloque '+r;
const lshow=c=>{const s=locSplit(c);return !s?c:/[1-9]/.test(s.z)?c:s.z+s.r+' '+s.m+' '+s.n};
const lpos=c=>{const s=locSplit(c);return !s?'':/[1-9]/.test(s.z)?'Rack '+s.r+' · Módulo '+s.m+' · Nivel '+s.n:'Bloque '+s.r+' · Columna '+s.m+' · Nivel '+s.n};
function zonasD(){return D.zonas.slice().sort((a,b)=>ZORD.indexOf(a)-ZORD.indexOf(b))}
function racks(z){const s=new Set();Object.keys(D.locs).forEach(c=>{if(D.locs[c].z===z)s.add(D.locs[c].r)});return [...s].sort()}
function lista(z,r){return Object.keys(D.locs).filter(c=>D.locs[c].z===z&&D.locs[c].r===r).sort((a,b)=>{const x=D.locs[a],y=D.locs[b];return x.m.localeCompare(y.m)||x.n.localeCompare(y.n)})}
const ST=c=>S.loc[c]||(S.loc[c]={items:{},extra:[],rev:false,nota:''});
function lstate(c){const l=D.locs[c],s=S.loc[c];if(!s)return 'pend';const dec=l.a.filter(a=>s.items[a[0]]).length;
  if(s.rev)return(l.a.some(a=>s.items[a[0]]==='no')||s.extra.length)?'dis':'done';
  return(dec>0||s.extra.length)?'prog':'pend'}
function totals(){let n=0,d=0,ok=0,no=0,ex=0,rev=0;Object.keys(D.locs).forEach(c=>{n++;const st=lstate(c);if(st==='done'||st==='dis')rev++;const s=S.loc[c];if(s){D.locs[c].a.forEach(a=>{if(s.items[a[0]]==='ok')ok++;else if(s.items[a[0]]==='no')no++});ex+=s.extra.length}});return{n,rev,ok,no,ex}}
function save(){S.t=Date.now();try{localStorage.setItem('ver_'+D.id,JSON.stringify(S))}catch(x){}}
function msg(t,k){const m=$('#msg');m.className=k?'m-'+k:'';m.textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>{m.textContent='';m.className=''},3500)}
function logm(c,why,det){S.log.push({t:new Date().toISOString(),loc:c,acc:why,det:det||''})}
/* ================= acciones ================= */
function setItem(c,cod,v){const s=ST(c);if(s.items[cod]===v)delete s.items[cod];else s.items[cod]=v;s.rev=false;if(!S.ini)S.ini=new Date().toISOString();logm(c,v,cod);save();render()}
function okTodo(c){const s=ST(c);D.locs[c].a.forEach(a=>{if(!s.items[a[0]])s.items[a[0]]='ok'});s.rev=false;logm(c,'ok-todo');save();render()}
function vacia(c){const l=D.locs[c],s=ST(c);if(l.a.length&&!confirm('La ubicación está vacía: los '+l.a.length+' artículo(s) del sistema se marcarán como NO ubicados. ¿Seguro?'))return;
  l.a.forEach(a=>s.items[a[0]]='no');s.rev=true;s.vacia=true;if(!S.ini)S.ini=new Date().toISOString();logm(c,'vacia');save();msg('Ubicación marcada como vacía','ok');irSig(true)}
function terminar(c){const l=D.locs[c],s=ST(c);const f=l.a.filter(a=>!s.items[a[0]]).length;if(f){msg('Faltan '+f+' artículo(s) por marcar (OK o No está)','er');return}
  s.rev=true;if(!S.ini)S.ini=new Date().toISOString();logm(c,'revisada');save();msg('Ubicación revisada','ok');irSig(true)}
function reabrir(c){ST(c).rev=false;save();render()}
function irSig(pend){const L=lista(cur.z,cur.r);let i=cur.i+1;if(pend){while(i<L.length&&['done','dis'].includes(lstate(L[i])))i++}
  if(i>=L.length){const t=L.filter(c=>!['done','dis'].includes(lstate(c))).length;msg(t?'Fin del rack. Quedan '+t+' ubicación(es) sin revisar en él.':'¡Rack completo!','ok');render();return}
  cur.i=i;render();window.scrollTo(0,0)}
function irPrev(){if(cur.i>0){cur.i--;render();window.scrollTo(0,0)}}
function abrir(c){const l=D.locs[c];cur.z=l.z;cur.r=l.r;cur.i=lista(l.z,l.r).indexOf(c);tab='rev';render();window.scrollTo(0,0)}
function setZona(z){cur.z=z;cur.r=racks(z)[0];cur.i=0;render()}
function setRack(r){cur.r=r;const L=lista(cur.z,r);const f=L.findIndex(c=>!['done','dis'].includes(lstate(c)));cur.i=f<0?0:f;render()}
function nota(c,v){ST(c).nota=v;save()}
function otraUbic(){const v=(prompt('Código de la ubicación (p. ej. 1K052 o D02011):')||'').trim().toUpperCase().replace(/\s+/g,'');if(!v)return;const s=locSplit(v);if(!s){msg('Código no válido','er');return}
  if(!D.locs[v]){D.locs[v]={z:s.z,r:s.r,m:s.m,n:s.n,a:[],man:true};if(!D.zonas.includes(s.z))D.zonas.push(s.z);S.man=S.man||{};S.man[v]=D.locs[v];save()}abrir(v)}
/* artículo no registrado */
function getCat(){if(!D._cat)D._cat=D.cat.split('\n').map(l=>{const i=l.indexOf('\t');return[l.slice(0,i),l.slice(i+1)]});return D._cat}
function catBuscar(q){q=q.trim().toUpperCase();if(q.length<2)return[];
  const a=[];for(const x of getCat()){if(x[0].toUpperCase().startsWith(q)){a.push(x);if(a.length>=8)break}}
  if(a.length<8)for(const x of getCat()){if(a.length>=8)break;if(!x[0].toUpperCase().startsWith(q)&&(x[0].toUpperCase().includes(q)||x[1].toUpperCase().includes(q)))a.push(x)}return a}
function modalExtra(c){$('#modal').style.display='block';$('#mbox').innerHTML='<h3 style="margin:0 0 8px">Artículo no registrado en '+esc(lshow(c))+'</h3><div class="desc" style="margin-bottom:8px">Está físicamente en esta ubicación pero no figura en el sistema.</div>'+
  '<input class="fq" id="x_cod" placeholder="Código del artículo" autocomplete="off" autocapitalize="characters"><div id="x_sug"></div><input class="fi" id="x_desc" placeholder="Descripción (opcional)"><input class="fi" id="x_qty" type="number" inputmode="numeric" min="0" placeholder="Cantidad (opcional)"><input class="fi" id="x_nota" placeholder="Nota (opcional)"><div id="x_info"></div>'+
  '<div class="row"><button class="b g" style="flex:1" onclick="cierraModal()">Cancelar</button><button class="b ok" style="flex:2" onclick="guardaExtra(\''+c+'\')">Guardar</button></div>';
  const inp=$('#x_cod');inp.focus();inp.oninput=()=>{const q=inp.value;const r=catBuscar(q);$('#x_sug').innerHTML=r.length?'<div class="sug">'+r.map(x=>'<div data-c="'+esc(x[0])+'" data-d="'+esc(x[1])+'"><b>'+esc(x[0])+'</b> '+esc(x[1])+'</div>').join('')+'</div>':'';
    $('#x_sug').querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{inp.value=e.dataset.c;$('#x_desc').value=e.dataset.d;$('#x_sug').innerHTML='';info(e.dataset.c)})};
  inp.onchange=()=>info(inp.value);
  function info(v){v=v.trim().toUpperCase();const w=D.where[v];const f=getCat().find(x=>x[0].toUpperCase()===v);if(f&&!$('#x_desc').value)$('#x_desc').value=f[1];
    $('#x_info').innerHTML=w&&w.length?'<div class="warn">En el sistema figura en: '+w.slice(0,4).map(esc).join(', ')+(w.length>4?'…':'')+'</div>':(f?'<div class="desc">Existe en el sistema sin ubicación asignada.</div>':(v?'<div class="warn">Código no encontrado en el sistema.</div>':''))}}
function cierraModal(){$('#modal').style.display='none'}
function guardaExtra(c){const cod=$('#x_cod').value.trim().toUpperCase();if(!cod){msg('Indica el código del artículo','er');return}
  const l=D.locs[c];if(l.a.some(a=>a[0].toUpperCase()===cod)){msg('Ese artículo ya figura en la ubicación: márcalo OK','er');return}
  const s=ST(c);if(s.extra.some(e=>e.cod===cod)){msg('Ya lo has añadido','er');return}
  s.extra.push({cod,desc:$('#x_desc').value.trim(),qty:$('#x_qty').value.trim(),nota:$('#x_nota').value.trim()});s.rev=false;if(!S.ini)S.ini=new Date().toISOString();logm(c,'no-registrado',cod);save();cierraModal();render();msg('Añadido como no registrado','ok')}
function delExtra(c,i){const s=ST(c);const e=s.extra.splice(i,1)[0];logm(c,'quita-no-registrado',e&&e.cod);save();render()}
/* ================= vistas ================= */
function renderSetup(){
  let h='<div class="card"><div class="cb"><h3 style="margin:0 0 6px">Preparar la revisión</h3><div class="desc">Carga <b>Almacen_A.csv</b> para saber qué artículos figuran en cada ubicación. El operario irá ubicación por ubicación marcando OK / No está y añadiendo lo que encuentre y no figure.</div>'+
   '<div class="row"><input type="file" id="fcsv" accept=".csv"></div>';
  if(setup.raw){h+='<div class="desc" style="margin:6px 0"><b>'+esc(setup.name)+'</b> · '+setup.raw.nArt.toLocaleString('es-ES')+' artículos</div><div style="margin:8px 0"><b>Zonas a revisar</b></div>';
    Object.keys(setup.raw.zonas).sort((a,b)=>ZORD.indexOf(a)-ZORD.indexOf(b)).forEach(z=>{const o=setup.raw.zonas[z];h+='<label class="ck"><input type="checkbox" data-z="'+z+'" '+(setup.zonas[z]?'checked':'')+'><span><b>'+zname(z)+'</b> <span class="desc">· '+o.n+' ubicaciones con stock · '+o.art+' artículos</span></span></label>'});
    h+='<label class="ck"><input type="checkbox" id="smapa" '+(setup.mapa!==false?'checked':'')+'><span>Incluir también las ubicaciones vacías del mapa del Sector 1 <span class="desc">(para poder detectar artículos no registrados)</span></span></label>'+
    '<div class="row"><button class="b ok" style="flex:1" onclick="empezar()">Empezar revisión</button></div>'}
  h+='</div></div>';$('#app').innerHTML=h;
  const f=$('#fcsv');if(f)f.onchange=async e=>{const file=e.target.files[0];if(!file)return;try{setup.raw=analizarCSV(decodeBuf(await file.arrayBuffer()),file.name);setup.name=file.name;setup.zonas={};['1','C','D','E'].forEach(z=>{if(setup.raw.zonas[z])setup.zonas[z]=true});renderSetup()}catch(err){msg(err.message,'er')}};
  document.querySelectorAll('[data-z]').forEach(e=>e.onchange=()=>{setup.zonas[e.dataset.z]=e.checked});const sm=$('#smapa');if(sm)sm.onchange=()=>{setup.mapa=sm.checked}}
function empezar(){const zs=Object.keys(setup.zonas).filter(z=>setup.zonas[z]);if(!zs.length){msg('Elige al menos una zona','er');return}
  D=crearDatos(setup.raw,zs,setup.mapa!==false);S={v:1,t:0,oper:'',ini:null,fin:null,loc:{},log:[]};cur={z:zonasD()[0],r:null,i:0};cur.r=racks(cur.z)[0];save();tab='rev';render()}
function lineaArt(c,a){const s=ST(c);const v=s.items[a[0]]||'';
  return '<div class="ln '+v+'"><div style="display:flex;justify-content:space-between;gap:6px"><div style="min-width:0"><div class="code">'+esc(a[0])+'</div><div class="ds">'+esc(a[1])+'</div></div><div style="text-align:right;white-space:nowrap"><span class="tag '+(a[3].indexOf('P')>=0?'p':'s')+'">'+(a[3]==='P'?'Picking':a[3]==='S'?'Sobrestock':'Pick.+Sobr.')+'</span><div class="desc">Stock total: '+a[2]+'</div></div></div>'+
   '<div class="bt"><button class="b '+(v==='ok'?'ok':'g')+'" onclick="setItem(\''+c+'\',\''+esc(a[0]).replace(/'/g,'')+'\',\'ok\')">'+(v==='ok'?'✔ OK':'✔ OK')+'</button><button class="b '+(v==='no'?'er':'g')+'" onclick="setItem(\''+c+'\',\''+esc(a[0]).replace(/'/g,'')+'\',\'no\')">'+(v==='no'?'✖ No está':'✖ No está')+'</button></div></div>'}
function renderRev(){
  const zs=zonasD();let h='<div class="sel"><select id="sz">'+zs.map(z=>'<option value="'+z+'"'+(z===cur.z?' selected':'')+'>'+zname(z)+'</option>').join('')+'</select><select id="sr">'+racks(cur.z).map(r=>{const L=lista(cur.z,r);const d=L.filter(c=>['done','dis'].includes(lstate(c))).length;return '<option value="'+r+'"'+(r===cur.r?' selected':'')+'>'+rname(cur.z,r)+' ('+d+'/'+L.length+')</option>'}).join('')+'</select></div>';
  const L=lista(cur.z,cur.r);if(!L.length){$('#app').innerHTML=h+'<div class="desc">No hay ubicaciones.</div>';bind();return}
  if(cur.i>=L.length)cur.i=0;const c=L[cur.i],l=D.locs[c],s=S.loc[c]||{items:{},extra:[],rev:false,nota:''},st=lstate(c);
  const done=L.filter(x=>['done','dis'].includes(lstate(x))).length;
  h+='<div class="desc" style="margin-bottom:2px">Ubicación '+(cur.i+1)+' de '+L.length+' · revisadas '+done+'</div><div class="pb"><i style="width:'+Math.round(100*done/L.length)+'%"></i></div>';
  h+='<div class="card '+(st==='done'||st==='dis'?'done':'cur')+'"><div class="cb"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div style="font-size:34px;font-weight:800;line-height:1.05">'+esc(lshow(c))+'</div><div class="desc" style="font-size:14px">'+esc(lpos(c))+'</div></div>'+(s.rev?'<button class="b g sm" onclick="reabrir(\''+c+'\')">Reabrir</button>':'')+'</div>';
  if(s.rev)h+='<div class="'+(st==='dis'?'warn':'m-ok')+'" style="padding:6px 10px;border-radius:6px;margin-top:6px">'+(st==='dis'?'✔ Revisada con diferencias':(s.vacia?'✔ Revisada: ubicación vacía':'✔ Revisada'))+'</div>';
  h+='<div style="margin-top:8px;font-weight:700">En el sistema ('+l.a.length+')</div>';
  h+=l.a.length?l.a.map(a=>lineaArt(c,a)).join(''):'<div class="desc" style="padding:6px 0">El sistema no tiene ningún artículo en esta ubicación.</div>';
  if(l.a.length>1&&l.a.some(a=>!s.items[a[0]]))h+='<div class="row"><button class="b g" style="flex:1" onclick="okTodo(\''+c+'\')">✔ Marcar todos como OK</button></div>';
  h+='<div style="margin-top:8px;font-weight:700">No registrados ('+s.extra.length+')</div>';
  h+=s.extra.map((e,i)=>'<div class="ln ex"><div style="display:flex;justify-content:space-between;gap:6px"><div style="min-width:0"><div class="code">'+esc(e.cod)+'</div><div class="ds">'+esc(e.desc||'(sin descripción)')+(e.qty?' · '+esc(e.qty)+' uds':'')+(e.nota?' · '+esc(e.nota):'')+'</div></div><button class="b g sm" onclick="delExtra(\''+c+'\','+i+')">Quitar</button></div></div>').join('');
  h+='<div class="row"><button class="b wa" style="flex:1" onclick="modalExtra(\''+c+'\')">➕ Hay un artículo que no figura aquí</button></div>';
  h+='<input class="fi" placeholder="Nota de la ubicación (opcional)" value="'+esc(s.nota||'')+'" onchange="nota(\''+c+'\',this.value)">';
  h+='</div></div><div class="row"><button class="b g" style="flex:1" onclick="otraUbic()">Otra ubicación…</button></div>';
  $('#app').innerHTML=h;
  $('#foot').style.display='flex';$('#foot').innerHTML='<button class="b g" onclick="irPrev()" '+(cur.i===0?'disabled':'')+'>◀</button><button class="b er" onclick="vacia(\''+c+'\')">Vacía</button><button class="b ok" style="flex:2" onclick="terminar(\''+c+'\')">✓ Terminar y siguiente</button><button class="b g" onclick="irSig(false)">▶</button>';
  bind()}
function bind(){const sz=$('#sz'),sr=$('#sr');if(sz)sz.onchange=()=>setZona(sz.value);if(sr)sr.onchange=()=>setRack(sr.value)}
function renderLista(){
  const zs=zonasD();let h='<input class="fq" id="fq" placeholder="Buscar ubicación o artículo" value="'+esc(fqL)+'" autocomplete="off"><div class="sel"><select id="lz"><option value="">Todas las zonas</option>'+zs.map(z=>'<option value="'+z+'"'+(fzL===z?' selected':'')+'>'+zname(z)+'</option>').join('')+'</select><select id="lp"><option value="0">Todas</option><option value="1"'+(onlyPend?' selected':'')+'>Solo pendientes</option></select></div><div id="lres"></div>';
  $('#app').innerHTML=h;const f=()=>{fqL=$('#fq').value;fzL=$('#lz').value;onlyPend=$('#lp').value==='1';pintaLista()};$('#fq').oninput=f;$('#lz').onchange=f;$('#lp').onchange=f;pintaLista()}
function pintaLista(){const q=fqL.trim().toUpperCase().replace(/\s+/g,'');let cs=Object.keys(D.locs);
  cs=cs.filter(c=>(!fzL||D.locs[c].z===fzL)&&(!onlyPend||!['done','dis'].includes(lstate(c)))&&(!q||c.includes(q)||D.locs[c].a.some(a=>a[0].toUpperCase().includes(q)||a[1].toUpperCase().includes(q))));
  cs.sort((a,b)=>{const x=D.locs[a],y=D.locs[b];return ZORD.indexOf(x.z)-ZORD.indexOf(y.z)||x.r.localeCompare(y.r)||x.m.localeCompare(y.m)||x.n.localeCompare(y.n)});
  const tot=cs.length;cs=cs.slice(0,300);const NM={pend:'Pendiente',prog:'En curso',done:'Revisada',dis:'Con diferencias'};
  $('#lres').innerHTML='<div class="desc" style="margin-bottom:4px">'+tot+' ubicación(es)'+(tot>300?' · se muestran 300, afina la búsqueda':'')+'</div><div class="card">'+cs.map(c=>{const st=lstate(c),l=D.locs[c];return '<div class="lrow '+st+'" onclick="abrir(\''+c+'\')"><b>'+esc(lshow(c))+'</b><span class="desc">'+l.a.length+' art.'+(S.loc[c]&&S.loc[c].extra.length?' · +'+S.loc[c].extra.length+' no reg.':'')+'</span><span class="st">'+NM[st]+'</span></div>'}).join('')+'</div>'}
function filas(){const f=[];const t=S.oper||'';Object.keys(D.locs).forEach(c=>{const l=D.locs[c],s=S.loc[c]||{items:{},extra:[]};const base=[zname(l.z),rname(l.z,l.r),lshow(c)];
  l.a.forEach(a=>{const v=s.items[a[0]];f.push(base.concat([a[0],a[1],a[3]==='P'?'Picking':a[3]==='S'?'Sobrestock':'Picking+Sobrestock',v==='ok'?'OK':v==='no'?'NO ESTÁ':'PENDIENTE','',s.nota||'']))});
  s.extra.forEach(e=>f.push(base.concat([e.cod,e.desc||'','No registrado','NO REGISTRADO EN SISTEMA',e.qty||'',[e.nota,s.nota].filter(Boolean).join(' | ')])));
  if(!l.a.length&&!s.extra.length&&s.rev)f.push(base.concat(['','','','UBICACIÓN VACÍA (OK)','',s.nota||'']))});return f}
const HEAD=['Zona','Rack/Bloque','Ubicación','Artículo','Descripción','Tipo','Resultado','Cantidad','Nota'];
function exportar(){const f=filas();const dis=f.filter(r=>/NO ESTÁ|NO REGISTRADO/.test(r[6]));const t=totals();
  if(typeof XLSX!=='undefined'){const wb=XLSX.utils.book_new();
    const res=[['Verificación de ubicaciones',D.id],['Fecha',D.fecha],['Operario',S.oper||''],['Origen',D.origen],['Ubicaciones',t.n],['Revisadas',t.rev],['Artículos OK',t.ok],['Artículos NO ESTÁN',t.no],['Artículos no registrados',t.ex]];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),'Resumen');
    const w1=XLSX.utils.aoa_to_sheet([HEAD].concat(dis));w1['!cols']=[{wch:10},{wch:11},{wch:11},{wch:18},{wch:40},{wch:14},{wch:24},{wch:9},{wch:30}];XLSX.utils.book_append_sheet(wb,w1,'Discrepancias');
    const w2=XLSX.utils.aoa_to_sheet([HEAD].concat(f));w2['!cols']=w1['!cols'];XLSX.utils.book_append_sheet(wb,w2,'Revisión completa');
    XLSX.writeFile(wb,'VERIFICACION_UBICACIONES_'+stamp()+'.xlsx')}
  else{const csv='\uFEFF'+[HEAD].concat(f).map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');dl('VERIFICACION_UBICACIONES_'+stamp()+'.csv',csv,'text/csv')}
  msg('Resultado descargado','ok')}
function renderRes(){const t=totals();const f=filas().filter(r=>/NO ESTÁ|NO REGISTRADO/.test(r[6]));const pend=t.n-t.rev;
  let h='<div class="card"><div class="cb"><h3 style="margin:0 0 6px">Resumen</h3><div class="kp"><div><b>'+t.rev+'/'+t.n+'</b><span>ubicaciones revisadas</span></div><div><b style="color:var(--ok)">'+t.ok+'</b><span>artículos OK</span></div><div><b style="color:var(--er)">'+t.no+'</b><span>no están</span></div><div><b style="color:var(--wa)">'+t.ex+'</b><span>no registrados</span></div></div>'+
   (pend?'<div class="warn">'+pend+' ubicación(es) sin revisar.</div>':'<div class="m-ok" style="padding:8px;border-radius:6px">✔ Todas las ubicaciones revisadas</div>')+
   '<div class="row"><button class="b ok" style="flex:1" onclick="exportar()">📊 Descargar resultado (Excel)</button></div><div class="row"><button class="b g" onclick="guardar()">💾 Guardar progreso (HTML)</button><button class="b g" onclick="paraPDA()">📲 Archivo limpio para la PDA</button><button class="b er" onclick="reset()">Reiniciar</button></div></div></div>';
  h+='<div class="card"><div class="cb"><h3 style="margin:0 0 6px">Discrepancias ('+f.length+')</h3>'+(f.length?'<table><tr><th>Ubicación</th><th>Artículo</th><th>Resultado</th></tr>'+f.map(r=>'<tr><td>'+esc(r[2])+'</td><td><b>'+esc(r[3])+'</b><div class="desc">'+esc(r[4])+(r[7]?' · '+esc(r[7])+' uds':'')+'</div></td><td>'+(r[6]==='NO ESTÁ'?'<span style="color:var(--er);font-weight:600">No está</span>':'<span style="color:var(--wa);font-weight:600">No registrado</span>')+'</td></tr>').join('')+'</table>':'<div class="desc">Ninguna por ahora.</div>')+'</div></div>';
  $('#app').innerHTML=h}
/* ================= salida ================= */
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
function dl(name,txt,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime||'text/html'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function snapshot(conEstado){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#msg').innerHTML='';c.querySelector('#foot').innerHTML='';c.querySelector('#mbox').innerHTML='';c.querySelector('#modal').removeAttribute('style');
  const d2=Object.assign({},D);delete d2._cat;if(S&&S.man)Object.keys(S.man).forEach(k=>d2.locs[k]=S.man[k]);
  c.querySelector('#ver-datos').textContent=JSON.stringify(d2).replace(/<\//g,'<\\/');c.querySelector('#ver-estado').textContent=conEstado?JSON.stringify(S).replace(/<\//g,'<\\/'):'null';return '<!DOCTYPE html>\n'+c.outerHTML}
function guardar(){save();dl('VERIFICACION_PROGRESO_'+stamp()+'.html',snapshot(true));msg('Progreso guardado','ok')}
function paraPDA(){dl('VERIFICACION_PDA_'+D.id+'.html',snapshot(false));msg('Archivo para la PDA descargado','ok')}
function reset(){if(!confirm('Se borrará todo el progreso de esta revisión. ¿Seguro?'))return;S={v:1,t:0,oper:S.oper,ini:null,fin:null,loc:{},log:[]};save();tab='rev';render()}
/* ================= render ================= */
function render(){
  if(!D){$('#hprog').textContent='Sin datos';$('#hbar').style.width='0';$('#foot').style.display='none';document.querySelectorAll('#nav button').forEach(b=>b.style.display='none');renderSetup();return}
  document.querySelectorAll('#nav button').forEach(b=>{b.style.display='';b.classList.toggle('on',b.dataset.t===tab)});
  const t=totals();$('#hprog').textContent=t.rev+'/'+t.n+' ubicaciones';$('#hbar').style.width=(t.n?100*t.rev/t.n:0)+'%';$('#oper').value=S.oper||'';$('#fecha').textContent=D.fecha;
  $('#foot').style.display=tab==='rev'?'flex':'none';
  if(tab==='rev'){if(!cur.z){cur.z=zonasD()[0];cur.r=racks(cur.z)[0]}renderRev()}else if(tab==='lista')renderLista();else renderRes()}
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render();window.scrollTo(0,0)}};
$('#oper').onchange=e=>{if(S){S.oper=e.target.value;save()}};
function init(){let d=null;try{d=JSON.parse($('#ver-datos').textContent)}catch(x){}
  if(d){D=d;let e=null;try{e=JSON.parse($('#ver-estado').textContent)}catch(x){}let l=null;try{l=JSON.parse(localStorage.getItem('ver_'+D.id))}catch(x){}
    const p=(e&&l)?((l.t||0)>(e.t||0)?l:e):(e||l);S=p&&p.v===1?p:{v:1,t:0,oper:'',ini:null,fin:null,loc:{},log:[]};
    if(S.man)Object.keys(S.man).forEach(k=>{if(!D.locs[k])D.locs[k]=S.man[k]});
    cur.z=zonasD()[0];cur.r=racks(cur.z)[0];
    const f=lista(cur.z,cur.r).findIndex(c=>!['done','dis'].includes(lstate(c)));cur.i=f<0?0:f}
  render()}
init();
