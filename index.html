<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f4f4f2;--bg3:#ebebea;
  --text:#171717;--text2:#666;--text3:#aaa;
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.20);
  --c-aa:#1D9E75;--c-a:#5DCAA5;--c-b:#F5C060;--c-c:#F09595;
  --c-sin:#e0e0de;--c-obs:#B4B2A9;
  --sz:28px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1c;--bg2:#252525;--bg3:#2e2e2e;
  --text:#f0f0f0;--text2:#999;--text3:#555;
  --border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.22);
  --c-sin:#3a3a38;
}}

html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
.inv-drop{border-style:dashed}
/* ===== INVENTARIO A PALETS ===== */
.inv-ov{position:fixed;inset:0;background:var(--bg2);z-index:310;display:flex;flex-direction:column}
.inv-ov.open{display:flex}
.inv-top{background:var(--bg);border-bottom:1px solid var(--border2);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.inv-top h2{font-size:14px;font-weight:700;flex:1;min-width:120px}
.inv-main{flex:1;overflow-y:auto;padding:12px}
.inv-wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.inv-card{background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.inv-card h3{font-size:13px;font-weight:700}
.inv-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inv-b{padding:10px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--bg);color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.inv-b.pri{background:#185FA5;border-color:#185FA5;color:#fff}
.inv-b.ok{background:#1D9E75;border-color:#1D9E75;color:#fff}
.inv-b.warn{background:#F5C060;border-color:#F5C060;color:#3a2a00}
.inv-b.red{background:#E24B4A;border-color:#E24B4A;color:#fff}
.inv-b.sm{padding:5px 10px;font-size:12px}
.inv-b:disabled{opacity:.45;cursor:default}
.inv-in{padding:10px 12px;border-radius:8px;border:2px solid var(--border2);font:inherit;font-size:16px;background:var(--bg);color:var(--text);min-width:0}
.inv-in.big{width:100%;font-size:18px;font-weight:700}
.inv-chip{padding:8px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--bg);font-weight:700;font-size:14px;cursor:pointer;color:var(--text)}
.inv-chip.on{background:#185FA5;color:#fff;border-color:#185FA5}
.inv-chip.done{background:#E1F5EE;border-color:#1D9E75;color:#0F6E56}
.inv-chip small{display:block;font-size:10px;font-weight:600;opacity:.8}
.inv-loc{font-size:34px;font-weight:800;font-family:'Courier New',monospace;letter-spacing:1px}
.inv-sub{font-size:12px;color:var(--text2)}
.inv-bar{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden}.inv-bar i{display:block;height:100%;background:#1D9E75}
.inv-art{border:2px solid var(--border2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.inv-art.act{border-color:#185FA5;box-shadow:0 0 0 3px rgba(24,95,165,.15)}
.inv-art.dn{border-color:#1D9E75;background:#E1F5EE}
.inv-art.dn *{color:#0F6E56}
.inv-cod{font-family:'Courier New',monospace;font-weight:800;font-size:16px}
.inv-steps{display:flex;gap:6px;font-size:11px;font-weight:700}
.inv-steps span{padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--text2)}
.inv-steps span.on{background:#185FA5;color:#fff}.inv-steps span.ok{background:#1D9E75;color:#fff}
.inv-msg{padding:9px 12px;border-radius:8px;font-weight:700;font-size:13px}
.inv-msg.ok{background:#E1F5EE;color:#0F6E56}.inv-msg.err{background:#FCEBEB;color:#A32D2D}.inv-msg.wa{background:#FDF0E1;color:#8A5A12}
.inv-tb{width:100%;border-collapse:collapse;font-size:12px}
.inv-tb th{text-align:left;background:var(--bg3);padding:5px 7px;position:sticky;top:0}
.inv-tb td{padding:5px 7px;border-bottom:1px solid var(--border);vertical-align:top}
.inv-kpis{display:flex;gap:8px;flex-wrap:wrap}.inv-kpi{flex:1;min-width:90px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 10px}
.inv-kpi b{display:block;font-size:20px}.inv-kpi span{font-size:11px;color:var(--text2)}
#invPrt{display:none}
@media print{
 html.inv-printing,body.inv-printing{height:auto!important;overflow:visible!important}
 body.inv-printing > *:not(#invPrt){display:none!important}
 body.inv-printing #invPrt{display:block!important}
 #invPrt .pg{page-break-after:always;overflow:hidden}
 #invPrt .pg:last-child{page-break-after:auto}
 #invPrt .pg svg{display:block}
}

.inv-sm{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #F59E0B;border-radius:6px;padding:1px 6px;font-size:10px;font-weight:800;white-space:nowrap}
.inv-sm.big{display:block;font-size:13px;padding:6px 10px;margin:6px 0;text-align:center}

// Escapa texto antes de insertarlo en innerHTML (evita que una descripción, comentario o código
// con "<", ">" o comillas rompa el layout o inyecte marcado).
function escapeHtml(v){
  return String(v ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
// Igual, pero seguro para insertar dentro de un atributo onclick="...('VALOR')" de comillas simples.
function escapeAttrJs(v){
  return String(v ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

var STORAGE_PREFIX = 'inventario-palets:';
var _pendingGets = {};
window.addEventListener('message', function(ev){
  // Solo aceptar mensajes del propio portal (mismo origen que esta página), no de cualquier
  // ventana/iframe que decida enviarnos algo.
  if(ev.origin !== window.location.origin) return;
  var d = ev.data;
  if(!d || d.acbStorage!=='get-response') return;
  var cbs = _pendingGets[d.key];
  if(cbs){ delete _pendingGets[d.key]; cbs.forEach(function(fn){ fn(d.value); }); }
});
function portalStorageSet(key, value){
  try{ parent.postMessage({ acbStorage:'set', key: STORAGE_PREFIX+key, value: value }, '*'); }catch(e){}
}
function portalStorageGet(key){
  return new Promise(function(resolve){
    var fullKey = STORAGE_PREFIX+key;
    if(!_pendingGets[fullKey]) _pendingGets[fullKey] = [];
    _pendingGets[fullKey].push(resolve);
    try{ parent.postMessage({ acbStorage:'get', key: fullKey }, '*'); }catch(e){ resolve(null); }
    setTimeout(function(){ if(_pendingGets[fullKey]){ delete _pendingGets[fullKey]; resolve(null); } }, 400);
  });
}

  var result=[], cur='', inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(c===sep&&!inQ){result.push(cur.trim());cur='';}
    else cur+=c;
  }
  result.push(cur.trim());
  return result;
}
function splitCSVRows(txt){
  var rows=[], cur='', inQ=false;
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(c==='"') inQ=!inQ;
    else if((c==='\n')&&!inQ){rows.push(cur);cur='';continue;}
    cur+=c;
  }
  if(cur) rows.push(cur);
  return rows;
}
function toInt(s){return parseInt(String(s||'0').replace(',','.'))||0;}
function toFloat(s){return parseFloat(String(s||'0').replace(',','.'))||0;}
var LOC_RE = /([ABCDE])\s*([0-9]{2})\s*([0-9]{2})(?:\s*-\s*([0-9]{2}))?\s*([0-9])|(?:^|[^0-9A-Za-z])(1)([A-Z])\s?([0-9]{2})([0-9])(?![0-9])/g;
function extractLocs(str){
  var found = [];
  if(!str) return found;
  var m;
  LOC_RE.lastIndex = 0;
  while((m = LOC_RE.exec(str)) !== null){
    if(m[6]){ found.push(m[6]+m[7]+m[8]+m[9]); continue; } // Sector 1: 1 + letra + módulo + nivel
    var zona=m[1], bloque=m[2], col1=m[3], col2=m[4], nivel=m[5];
    if(col2){
      var c1=parseInt(col1,10), c2=parseInt(col2,10);
      var lo=Math.min(c1,c2), hi=Math.max(c1,c2);
      for(var c=lo;c<=hi;c++){ found.push(zona+bloque+String(c).padStart(2,'0')+nivel); }
    }else{ found.push(zona+bloque+col1+nivel); }
  }
  return found;
}
function addArticulo(zona, cod, tipo, art){
  if(!LOCS[zona][cod]) LOCS[zona][cod] = { tipo: tipo, articulos: [] };
  // Copia por ubicación: un mismo artículo puede estar a la vez en su ubicación
  // de picking y en una o más de sobrestock (campos UbicacionCodigo/Alt1/Alt2 del CSV).
  // Se guarda el tipo con el que llega A ESTA ubicación en concreto (tipoAqui), para
  // poder distinguirlo en el detalle aunque el conjunto de la celda se etiquete por
  // su ocupante principal (loc.tipo).
  var artAqui = {};
  for(var k in art){ artAqui[k] = art[k]; }
  artAqui.tipoAqui = tipo;
  LOCS[zona][cod].articulos.push(artAqui);
}
var SOB_QTY_RE = /([AB])\s*([0-9]{2})\s*([0-9]{2})(?:\s*-\s*([0-9]{2}))?\s*([0-9])(?![0-9])(?:[\s.]*(?:[()]+\s*([0-9]+)\s*\)?|\s+([0-9]+)\s*\)))?/g;
function extraerSobrestockConCantidad(textos){
  var out = [], vistas = {};
  textos.forEach(function(raw){
    if(!raw) return;
    SOB_QTY_RE.lastIndex = 0;
    var m;
    while((m = SOB_QTY_RE.exec(raw)) !== null){
      var q = m[6] || m[7];
      var qty = q ? parseInt(q, 10) : null;
      var locs = [];
      if(m[4]){
        // Rango de columnas (p.ej. "B01 03-04 1"): no se puede saber cuántas unidades hay en
        // cada columna del rango, así que la cantidad queda desconocida en todas.
        var c1 = parseInt(m[3],10), c2 = parseInt(m[4],10);
        for(var c=Math.min(c1,c2); c<=Math.max(c1,c2); c++) locs.push(m[1]+m[2]+String(c).padStart(2,'0')+m[5]);
        qty = null;
      }else{
        locs.push(m[1]+m[2]+m[3]+m[5]);
      }
      locs.forEach(function(loc){
        if(vistas[loc]) return;
        vistas[loc] = true;
        out.push({ loc: loc, zona: loc[0], qty: qty });
      });
    }
  });
  return out;
}
function parseFechaEs(s){ // "27-nov-23" → Date (formato de fecha_grabacion en el __GENERAL)
  var m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/.exec(String(s||'').trim());
  if(!m) return null;
  var mes = MESES_ES[m[2].toLowerCase()];
  if(mes === undefined) return null;
  var y = parseInt(m[3], 10); if(y < 100) y += 2000;
  return new Date(y, mes, parseInt(m[1], 10));
}

/* ================= CARGA DE FICHEROS (app independiente) =================
   Almacen_A.csv (obligatorio): existencias, EAN y ubicaciones (picking, Alt1, Alt2) de cada artículo.
   __GENERAL.csv (opcional): consumo mensual (columnas "0" a "5"), para marcar los artículos sin movimiento en 6 meses.
   Los ficheros se guardan en este navegador (IndexedDB) para no tener que volver a cargarlos tras recargar la página. */
var ARTICULOS_STOCK = null, ALMACEN_A_ART = {}, EAN2COD = {};
var ARCH = { almacen:null, general:null };   // {nombre, ts, n, extra}
var INCIDENCIAS_SA = [];
function nowTs(){ return new Date().toLocaleString('es-ES'); }
function detectarTipoCSV(txt){
  var primera = String(txt || '').replace(/^﻿/, '').split('\n')[0];
  var h = parseCSVLine(primera, ';').map(function(x){ return x.trim(); });
  if(h.indexOf('UbicacionCodigo') >= 0) return 'almacenA';
  if(h.indexOf('UBICAC') >= 0) return 'general';
  return null;
}
function registrarIncidenciaUbicacion(cod, desc, raw, campo){ INCIDENCIAS_SA.push({ art:cod, desc:desc, raw:raw, campo:campo }); }
function parseAlmacenA(txt){
  txt = String(txt).replace(/^﻿/, '');
  var lines = splitCSVRows(txt), headers = parseCSVLine(lines[0], ';');
  function idx(name){ for(var i = 0; i < headers.length; i++) if(headers[i].trim() === name) return i; return -1; }
  ZONAS.forEach(function(z){ LOCS[z] = {}; }); INCIDENCIAS_SA = [];
  ARTICULOS_STOCK = []; ALMACEN_A_ART = {}; EAN2COD = {};
  var iVolA = idx('Volumen'), iCod = idx('Codigo'), iDesc = idx('Descripcion'), iUbi = idx('UbicacionCodigo');
  var iAlt1 = idx('UbicacionCodigoAlt1'), iAlt2 = idx('UbicacionCodigoAlt2'), iEx = idx('Existencias'), iU3 = idx('UDS_3Meses'), iEan = idx('EAN');
  for(var i = 1; i < lines.length; i++){
    var line = lines[i].trim(); if(!line) continue;
    var f = parseCSVLine(line, ';');
    var cod = f[iCod] || ''; if(!cod) continue;
    var desc = (f[iDesc] || '').substring(0, 70), exist = toInt(f[iEx]), rot3m = toInt(f[iU3]);
    var art = { cod:cod, desc:desc, exist:exist, rot3m:rot3m };
    var ubi = (f[iUbi] || '').trim();
    var sob = extraerSobrestockConCantidad([f[iAlt1] || '', f[iAlt2] || '']);
    var eans = iEan >= 0 ? String(f[iEan] || '').split(/[\s,;|]+/).filter(function(e){ return e && e.length >= 6; }) : [];
    eans.forEach(function(e){ EAN2COD[String(e).toUpperCase().replace(/[^A-Z0-9]/g, '')] = cod; });
    var locsAll = extractLocs(ubi).concat(extractLocs(f[iAlt1] || ''), extractLocs(f[iAlt2] || ''), sob.map(function(s){ return s.loc; })).filter(function(l, k, arr){ return arr.indexOf(l) === k; });
    ALMACEN_A_ART[cod] = { exist:exist, desc:desc, ean:eans, locsAll:locsAll,
      ubicTxt:[ubi, (f[iAlt1] || '').trim(), (f[iAlt2] || '').trim()].filter(Boolean).join(' · '),
      locs:extractLocs(ubi).concat(sob.map(function(s){ return s.loc; })).filter(function(l, k, arr){ return arr.indexOf(l) === k; }),
      vol:iVolA >= 0 ? toFloat(f[iVolA]) : 0 };
    if(ubi || sob.length) ARTICULOS_STOCK.push({ cod:cod, desc:desc, exist:exist, rot3m:rot3m, pick:(extractLocs(ubi)[0] || ''), sob:sob });
    if(ubi){
      var lp = extractLocs(ubi);
      if(!lp.length) registrarIncidenciaUbicacion(cod, desc, ubi, 'UbicacionCodigo');
      else lp.forEach(function(loc){
        if(!LOCS[loc[0]]) return;
        if(!REF[loc[0]] || REF[loc[0]][loc]) addArticulo(loc[0], loc, 'picking', art);
        else registrarIncidenciaUbicacion(cod, desc, loc + ' (no existe en el mapa)', 'UbicacionCodigo');
      });
    }
    [[f[iAlt1], 'UbicacionCodigoAlt1'], [f[iAlt2], 'UbicacionCodigoAlt2']].forEach(function(pair){
      var raw = (pair[0] || '').trim(); if(!raw) return;
      var ls = extractLocs(raw);
      if(!ls.length){ registrarIncidenciaUbicacion(cod, desc, raw, pair[1]); return; }
      ls.forEach(function(loc){
        if(!LOCS[loc[0]]) return;
        if(!REF[loc[0]] || REF[loc[0]][loc]) addArticulo(loc[0], loc, 'sobrestock', art);
        else registrarIncidenciaUbicacion(cod, desc, loc + ' (no existe en el mapa)', pair[1]);
      });
    });
  }
  return Object.keys(ALMACEN_A_ART).length;
}
var CODIGO_VALIDO_RE = /^[A-Za-z0-9._-]+$/;
function parseGeneral(txt){
  txt = String(txt).replace(/^﻿/, '');
  var lines = splitCSVRows(txt), headers = parseCSVLine(lines[0], ';');
  function idx(name){ for(var i = 0; i < headers.length; i++) if(headers[i].trim() === name) return i; return -1; }
  var iCod = idx('CODIGO'), iAlta = idx('fecha_grabacion');
  var iMs = [idx('0'), idx('1'), idx('2'), idx('3'), idx('4'), idx('5')].filter(function(x){ return x >= 0; });
  ART_CONS6 = {}; ART_CONS6_REF = null; ART_G_INFO = { cab:headers.map(function(s){ return s.trim(); }), meses:iMs.length };
  if(iCod < 0 || !iMs.length) return 0;
  for(var i = 1; i < lines.length; i++){
    var line = lines[i].trim(); if(!line) continue;
    var f = parseCSVLine(line, ';'), cod = (f[iCod] || '').trim();
    if(!cod || !CODIGO_VALIDO_RE.test(cod)) continue;
    var s6 = 0; iMs.forEach(function(x){ s6 += toFloat(f[x]) || 0; });
    var al = iAlta >= 0 ? parseFechaEs(f[iAlta]) : null;
    ART_CONS6[cod] = { s:s6, alta:al };
    if(al && (!ART_CONS6_REF || al > ART_CONS6_REF)) ART_CONS6_REF = al;
  }
  return Object.keys(ART_CONS6).length;
}
/* --- almacenamiento local de los CSV (IndexedDB) --- */
function idbOp(mode, fn){
  return new Promise(function(res){
    try{
      var rq = indexedDB.open('inv_palets_files', 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('f'); };
      rq.onerror = function(){ res(null); };
      rq.onsuccess = function(){ var db = rq.result, tx = db.transaction('f', mode), st = tx.objectStore('f'), r = fn(st); tx.oncomplete = function(){ res(r && r.result !== undefined ? r.result : true); db.close(); }; tx.onerror = function(){ res(null); }; };
    }catch(e){ res(null); }
  });
}
function idbPut(k, v){ return idbOp('readwrite', function(st){ return st.put(v, k); }); }
function idbGet(k){ return idbOp('readonly', function(st){ return st.get(k); }); }
function idbDel(k){ return idbOp('readwrite', function(st){ return st.delete(k); }); }
function leerTexto(file){ return new Promise(function(ok, ko){ var r = new FileReader(); r.onload = function(e){ ok(e.target.result); }; r.onerror = function(){ ko(new Error('No se pudo leer ' + file.name)); }; r.readAsText(file, 'UTF-8'); }); }
function aplicarFichero(slot, nombre, txt, ts){
  var tipo = detectarTipoCSV(txt), esperado = slot === 'almacen' ? 'almacenA' : 'general';
  if(tipo !== esperado) throw new Error('«' + nombre + '» no parece un ' + (slot === 'almacen' ? 'Almacen_A (debe tener la columna UbicacionCodigo)' : '__GENERAL (debe tener la columna UBICAC)') + (tipo ? ' — parece un ' + (tipo === 'almacenA' ? 'Almacen_A' : '__GENERAL') : '') + '.');
  var n = slot === 'almacen' ? parseAlmacenA(txt) : parseGeneral(txt);
  if(slot === 'almacen' && !n) throw new Error('«' + nombre + '» no contiene artículos.');
  ARCH[slot] = { nombre:nombre, ts:ts || nowTs(), n:n, extra:slot === 'almacen' ? INCIDENCIAS_SA.length : (ART_G_INFO ? ART_G_INFO.meses : 0) };
}
function archCargar(slot, file){
  if(!file) return;
  leerTexto(file).then(function(txt){
    try{ aplicarFichero(slot, file.name, txt); }catch(e){ INV_UI.msg = { c:'err', t:e.message }; invRender(); return; }
    idbPut(slot, { nombre:file.name, ts:ARCH[slot].ts, txt:txt });
    if(slot === 'almacen' && !LOCS[INV.zona]) INV.zona = '1';
    INV_UI.msg = { c:'ok', t:'Cargado ' + file.name + ' (' + ARCH[slot].n + ' registros).' };
    invRender();
  }).catch(function(e){ INV_UI.msg = { c:'err', t:e.message }; invRender(); });
}
function archQuitar(slot){
  if(slot === 'almacen'){ if(!confirm('¿Quitar el Almacen_A cargado? Se mantiene la sesión de inventario ya hecha.')) return; ZONAS.forEach(function(z){ LOCS[z] = {}; }); ALMACEN_A_ART = {}; ARTICULOS_STOCK = null; EAN2COD = {}; }
  else { ART_CONS6 = {}; ART_CONS6_REF = null; ART_G_INFO = null; }
  ARCH[slot] = null; idbDel(slot); invRender();
}
function archDrop(ev, slot){ ev.preventDefault(); var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]; if(f) archCargar(slot, f); }
function archRestaurar(){
  return Promise.all([idbGet('almacen'), idbGet('general')]).then(function(r){
    if(r[0] && r[0].txt){ try{ aplicarFichero('almacen', r[0].nombre, r[0].txt, r[0].ts); }catch(e){} }
    if(r[1] && r[1].txt){ try{ aplicarFichero('general', r[1].nombre, r[1].txt, r[1].ts); }catch(e){} }
  });
}
function invHtmlArch(){

/* ================= INVENTARIO A PALETS =================
   El operario elige sector y letra/pasillo, recorre ubicación por ubicación verificando código de artículo,
   unidades y ubicación, y deja cada referencia en un palet (se escanea el código del palet).
   Salida: Excel con una hoja de discrepancias (stock del CSV inicial frente a lo contado) y una hoja por palet. */
var INV_KEY = 'inv_palets_v1';
var INV = { oper:'', pref:'PAL', next:1, done:{}, moves:[], palets:{}, zona:'1', grupo:'', vacias:null, loc:null, locOk:{}, view:'setup' };
var INV_UI = { cur:null, add:false, msg:null, nota:null };
var EAN2COD = {};
/* Sin movimiento: el __GENERAL solo trae consumo (salidas) por mes — columnas "0" (mes en curso) y "1".."5" (cinco meses cerrados).
   Un artículo se marca si la suma de esas seis columnas es 0 y no es un alta reciente (menos de 6 meses). */
var ART_G_INFO = null, ART_CONS6 = {}, ART_CONS6_REF = null, INV_SINMOV_MESES = 6;
function invSinMovCarga(){ return Object.keys(ART_CONS6).length > 0; }
function invSinMov(cod){
  var a = ART_CONS6[cod]; if(!a || a.s > 0) return false;
  var ref = ART_CONS6_REF || new Date();
  if(a.alta){ var lim = new Date(ref.getFullYear(), ref.getMonth() - INV_SINMOV_MESES, ref.getDate()); if(a.alta > lim) return false; }
  return true;
}
function invSmTag(cod){ return invSinMov(cod) ? ' <span class="inv-sm" title="Consumo 0 en el mes en curso y los 5 meses cerrados anteriores (__GENERAL)">⏳ SIN MOV. 6 MESES</span>' : ''; }
function invSmStock(z, locs){ // artículos sin movimiento en un conjunto de ubicaciones
  var seen = {}, out = [];
  locs.forEach(function(l){ invArtsSistema(z, l).forEach(function(a){ if(!seen[a.cod] && invSinMov(a.cod)){ seen[a.cod] = 1; out.push({ cod:a.cod, desc:a.desc || invDescDe(a.cod), loc:l }); } }); });
  return out;
}

function invSave(){
  var o = { oper:INV.oper, pref:INV.pref, next:INV.next, done:INV.done, moves:INV.moves, palets:INV.palets, zona:INV.zona, grupo:INV.grupo, vacias:INV.vacias, loc:INV.loc, locOk:INV.locOk, curPalet:INV.curPalet, lab:INV.lab };
  var s = JSON.stringify(o);
  try{ localStorage.setItem(INV_KEY, s); }catch(e){}
  try{ portalStorageSet('inv-palets', s); }catch(e){}
  invBadge();
}
function invLoad(){
  try{ var s = localStorage.getItem(INV_KEY); if(s){ var o = JSON.parse(s); for(var k in o){ INV[k] = o[k]; } } }catch(e){}
}
function invBadge(){
  var n = INV.moves.filter(function(m){ return m.uds > 0; }).length;
  var b = document.getElementById('invBadge'); if(b){ b.textContent = n; b.style.display = n ? '' : 'none'; }
  var p = document.getElementById('invNPal'); if(p){ p.textContent = Object.keys(INV.palets).length ? '(' + Object.keys(INV.palets).length + ')' : ''; }
}
function invNorm(s){ return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function invZonaLbl(z){ return (typeof ZONA_LABEL !== 'undefined' && ZONA_LABEL[z]) || z; }
function invGrupoDe(z, loc){ return z === '1' ? loc.charAt(1) : loc.substr(1, 2); }
function invGrupoLbl(z, g){ return z === '1' ? 'Rack ' + g : 'Pasillo ' + g; }
function invOrdKey(z, loc){ return z === '1' ? loc.substr(2, 2) + loc.charAt(4) : loc.substr(3, 2) + loc.charAt(5); }
function invLocsDe(z){
  var set = {}; Object.keys((typeof REF !== 'undefined' && REF[z]) || {}).forEach(function(l){ set[l] = 1; });
  Object.keys(LOCS[z] || {}).forEach(function(l){ set[l] = 1; });
  return Object.keys(set);
}
function invGrupos(z){
  var g = {}; invLocsDe(z).forEach(function(l){ var k = invGrupoDe(z, l); (g[k] = g[k] || []).push(l); });
  Object.keys(g).forEach(function(k){ g[k].sort(function(a, b){ return invOrdKey(z, a) < invOrdKey(z, b) ? -1 : 1; }); });
  return g;
}
function invConVacias(){ return INV.vacias === null ? INV.zona === '1' : !!INV.vacias; }
function invLocsGrupo(){
  var all = (invGrupos(INV.zona)[INV.grupo] || []);
  if(invConVacias()) return all;
  return all.filter(function(l){ return invArtsSistema(INV.zona, l).length || INV.done[l] || INV.moves.some(function(m){ return m.loc === l; }); });
}
function invInfo(cod){ return (typeof ALMACEN_A_ART !== 'undefined' && ALMACEN_A_ART && ALMACEN_A_ART[cod]) || null; }
function invArtsSistema(z, loc){
  var o = LOCS[z] && LOCS[z][loc]; if(!o) return []; var seen = {}, out = [];
  o.articulos.forEach(function(a){ if(seen[a.cod]) return; seen[a.cod] = 1; out.push(a); });
  return out;
}
function invQtyAqui(cod, loc){ // unidades anotadas en esa ubicación de sobrestock (si el CSV las trae)
  if(typeof ARTICULOS_STOCK === 'undefined' || !ARTICULOS_STOCK) return null;
  for(var i = 0; i < ARTICULOS_STOCK.length; i++){ if(ARTICULOS_STOCK[i].cod === cod){ var s = ARTICULOS_STOCK[i].sob.filter(function(x){ return x.loc === loc; })[0]; return s && s.qty != null ? s.qty : null; } }
  return null;
}
function invMovesLoc(loc){ return INV.moves.filter(function(m){ return m.loc === loc; }); }
function invDescDe(cod){ var i = invInfo(cod); return (i && i.desc) || ''; }
function invResolver(v){ // texto leído -> código de artículo (por EAN o por código)
  var raw = String(v || '').trim(); if(!raw) return null;
  var n = invNorm(raw);
  if(EAN2COD[n]) return EAN2COD[n];
  if(invInfo(raw)) return raw;
  var up = raw.toUpperCase(); if(invInfo(up)) return up;
  return null;
}
function invEanDe(cod, v){ var i = invInfo(cod); var n = invNorm(v); if(!i) return false; return invNorm(cod) === n || (i.ean || []).some(function(e){ return invNorm(e) === n; }); }
function invPad(n){ var s = String(n); while(s.length < 4) s = '0' + s; return s; }
function invNuevoPalet(){
  var c; do { c = INV.pref + '-' + invPad(INV.next++); } while(INV.palets[c]);
  INV.palets[c] = { creado: new Date().toISOString(), oper: INV.oper }; invSave(); return c;
}
function invPaletDe(v){ // normaliza un código de palet leído; null si no tiene forma de palet
  var s = String(v || '').trim().toUpperCase().replace(/[\s_]+/g, '-');
  var pref = String(INV.pref || 'PAL').toUpperCase();
  var m = new RegExp('^' + pref.replace(/[^A-Z0-9]/g, '') + '-?([0-9]+)$').exec(s);
  if(!m) return null;
  return pref + '-' + invPad(parseInt(m[1], 10));
}
function invOpen(){
    archRestaurar().then(function(){
    if(!LOCS[INV.zona]) INV.zona = '1';
    if(!ARCH.almacen) INV.view = 'arch';
    if(INV.view === 'loc' && INV.loc && ARCH.almacen){ invRender(); } else { invGo(ARCH.almacen ? 'setup' : 'arch'); }
  });
}
function invGo(v){ INV.view = v; INV_UI.msg = null; INV_UI.cur = null; INV_UI.add = false; invRender(); }
function invMsg(t, c){ INV_UI.msg = t ? { t:t, c:c || 'err' } : null; }

/* ---------- render ---------- */
function invRender(){
  var b = document.getElementById('invBody'); if(!b) return;
  var h = '';
  if(INV.view === 'setup') h = invHtmlSetup();
  else if(INV.view === 'loc') h = invHtmlLoc();
  else if(INV.view === 'arch') h = invHtmlArch();
  else if(INV.view === 'palets') h = invHtmlPalets();
  else if(INV.view === 'etiq') h = invHtmlEtiq();
  else h = invHtmlResumen();
  b.innerHTML = h;
  document.getElementById('invTitle').textContent = 'Inventario a palets' + (INV.view === 'loc' && INV.loc ? ' · ' + INV.loc : '');
  invBadge();
  invFocus();
}
function invFocus(){
  setTimeout(function(){
    var e = document.getElementById('invUds') || document.getElementById('invScan'); if(e){ e.focus(); if(e.select && e.id === 'invUds') e.select(); }
  }, 30);
}
function invMsgHtml(){ return INV_UI.msg ? '<div class="inv-msg ' + INV_UI.msg.c + '">' + escapeHtml(INV_UI.msg.t) + '</div>' : ''; }

function invHtmlSetup(){
  if(!ARCH.almacen) return invHtmlArch();
  var zs = ZONAS.filter(function(z){ return invLocsDe(z).length; });
  var h = '<div class="inv-card"><h3>1 · Operario</h3><input class="inv-in big" id="invOper" placeholder="Nombre del operario" value="' + escapeHtml(INV.oper) + '" onchange="INV.oper=this.value.trim();invSave()"></div>';
  h += '<div class="inv-card"><h3>2 · Sector</h3><div class="inv-row">' + zs.map(function(z){ return '<button class="inv-chip' + (z === INV.zona ? ' on' : '') + '" onclick="invSetZona(\'' + z + '\')">' + escapeHtml(invZonaLbl(z)) + '</button>'; }).join('') + '</div></div>';
  var g = invGrupos(INV.zona), ks = Object.keys(g).sort();
  h += '<div class="inv-card"><h3>3 · ' + (INV.zona === '1' ? 'Letra del rack' : 'Pasillo') + '</h3><div class="inv-row">' + ks.map(function(k){
    var ls = g[k], nsm = invSmStock(INV.zona, ls).length, n = ls.filter(function(l){ return invArtsSistema(INV.zona, l).length; }).length, d = ls.filter(function(l){ return INV.done[l]; }).length;
    var all = d >= ls.length || (n && ls.filter(function(l){ return invArtsSistema(INV.zona, l).length && !INV.done[l]; }).length === 0 && d > 0);
    return '<button class="inv-chip' + (k === INV.grupo ? ' on' : (all ? ' done' : '')) + '" onclick="invSetGrupo(\'' + escapeAttrJs(k) + '\')">' + escapeHtml(k) + '<small>' + d + '/' + ls.length + '</small>' + (nsm ? '<small style="color:#B45309">⏳ ' + nsm + '</small>' : '') + '</button>'; }).join('') + '</div>';
  h += '<label class="inv-sub"><input type="checkbox" ' + (invConVacias() ? 'checked' : '') + ' onchange="INV.vacias=this.checked;invSave();invRender()"> Incluir ubicaciones vacías (para detectar artículos que no figuran en el sistema)</label></div>';
  if(!invSinMovCarga()){
    var di = ART_G_INFO ? '__GENERAL leído, pero no encuentro columnas de consumo mensual (cabeceras "0" a "5"). Cabeceras detectadas: ' + escapeHtml(ART_G_INFO.cab.join(' | ')) : 'No hay <b>__GENERAL</b> cargado en esta sesión: cárgalo en <b>📂 Archivos</b> (arriba).';
    h += '<div class="inv-card"><div class="inv-sub">⏳ No se pueden marcar los artículos sin movimiento en 6 meses. ' + di + '</div></div>';
  }
  else {
    var smS = invSmStock(INV.zona, invLocsDe(INV.zona));
    h += '<div class="inv-card"><div class="inv-sub">⏳ <b>' + smS.length + '</b> artículos ' + (ART_G_INFO && ART_G_INFO.meses < 6 ? '(solo ' + ART_G_INFO.meses + ' columnas de mes encontradas) ' : '') + 'de ' + escapeHtml(invZonaLbl(INV.zona)) + ' sin consumo en 6 meses' + (INV.grupo ? ' · en ' + escapeHtml(invGrupoLbl(INV.zona, INV.grupo)) + ': <b>' + invSmStock(INV.zona, invLocsGrupo()).length + '</b>' : '') + '</div>';
    if(smS.length) h += '<details><summary class="inv-sub" style="cursor:pointer">Ver listado' + (INV.grupo ? ' del ' + escapeHtml(invGrupoLbl(INV.zona, INV.grupo)) : ' del sector') + '</summary><table class="inv-tb">' + (INV.grupo ? invSmStock(INV.zona, invLocsGrupo()) : smS).map(function(x){ return '<tr><td><b>' + escapeHtml(x.cod) + '</b><div class="inv-sub">' + escapeHtml((x.desc || '').slice(0, 40)) + '</div></td><td>' + escapeHtml(x.loc) + '</td></tr>'; }).join('') + '</table></details>';
    h += '</div>';
  }
  if(INV.grupo){
    var ls = invLocsGrupo(), d = ls.filter(function(l){ return INV.done[l]; }).length;
    h += '<div class="inv-card"><h3>' + escapeHtml(invZonaLbl(INV.zona)) + ' · ' + escapeHtml(invGrupoLbl(INV.zona, INV.grupo)) + '</h3><div class="inv-sub">' + ls.length + ' ubicaciones · ' + d + ' verificadas</div><div class="inv-bar"><i style="width:' + (ls.length ? 100 * d / ls.length : 0) + '%"></i></div>';
    h += '<button class="inv-b pri" onclick="invEmpezar()"' + (ls.length ? '' : ' disabled') + '>' + (d ? '▶ Continuar' : '▶ Empezar') + '</button>';
    h += '<details><summary class="inv-sub" style="cursor:pointer">Ver ubicaciones</summary><div class="inv-row" style="margin-top:6px">' + ls.map(function(l){ return '<button class="inv-chip' + (INV.done[l] ? ' done' : '') + '" style="padding:5px 9px;font-size:12px" onclick="invIr(\'' + l + '\')">' + l + '</button>'; }).join('') + '</div></details></div>';
  }
  h += '<div class="inv-card"><div class="inv-row"><button class="inv-b" onclick="invGo(\'resumen\')">📊 Resumen y Excel</button><button class="inv-b red sm" onclick="invReset()">🗑 Borrar sesión</button></div></div>';
  return invMsgHtml() + h;
}
function invSetZona(z){ INV.zona = z; INV.grupo = ''; INV.vacias = null; invSave(); invRender(); }
function invSetGrupo(k){ INV.grupo = k; invSave(); invRender(); }
function invEmpezar(){
  var ls = invLocsGrupo(); var l = ls.filter(function(x){ return !INV.done[x]; })[0] || ls[0]; if(l) invIr(l);
}
function invIr(l){ INV.loc = l; INV.view = 'loc'; INV_UI.cur = null; INV_UI.add = false; INV_UI.msg = null; invSave(); invRender(); }
function invReset(){
  if(!confirm('¿Borrar TODA la sesión de inventario (verificaciones, palets y movimientos)? Descarga antes el Excel si lo necesitas.')) return;
  INV.done = {}; INV.moves = []; INV.palets = {}; INV.next = 1; INV.loc = null; INV.locOk = {}; INV.view = 'setup'; invSave(); invRender();
}

/* ---------- ubicación ---------- */
function invPend(loc){ // artículos de la ubicación aún sin resolver (sistema) + los añadidos a mano ya resueltos
  var mv = invMovesLoc(loc), res = {}; mv.forEach(function(m){ res[m.cod] = 1; });
  return invArtsSistema(INV.zona, loc).filter(function(a){ return !res[a.cod]; });
}
function invActiva(loc){
  if(INV_UI.cur && INV_UI.cur.loc === loc) return INV_UI.cur;
  var p = invPend(loc)[0]; if(!p) return null;
  INV_UI.cur = { loc:loc, cod:p.cod, desc:p.desc || invDescDe(p.cod), tipo:'sistema', step:'ean', eanOk:false, uds:null, palet:null };
  return INV_UI.cur;
}
function invHtmlLoc(){
  var loc = INV.loc, z = INV.zona; if(!loc) return invHtmlSetup();
  var ls = invLocsGrupo(), i = ls.indexOf(loc), d = ls.filter(function(l){ return INV.done[l]; }).length;
  var r = (typeof REF !== 'undefined' && REF[z] && REF[z][loc]) || null;
  var h = '<div class="inv-card"><div class="inv-row"><button class="inv-b sm" onclick="invNav(-1)">‹</button><div style="flex:1;text-align:center"><div class="inv-loc">' + escapeHtml(loc) + '</div><div class="inv-sub">' + escapeHtml(invZonaLbl(z)) + ' · ' + escapeHtml(invGrupoLbl(z, invGrupoDe(z, loc))) + (r ? ' · Módulo ' + escapeHtml(r.columna) + ' · Nivel ' + escapeHtml(r.nivel) : '') + '</div></div><button class="inv-b sm" onclick="invNav(1)">›</button></div>';
  h += '<div class="inv-bar"><i style="width:' + (ls.length ? 100 * d / ls.length : 0) + '%"></i></div><div class="inv-sub">' + (i + 1) + ' de ' + ls.length + ' · ' + d + ' verificadas' + (INV.done[loc] ? ' · <b style="color:#0F6E56">ESTA UBICACIÓN YA ESTÁ VERIFICADA</b>' : '') + '</div></div>';
  h += invMsgHtml();
  if(!INV.locOk[loc]){
    h += '<div class="inv-card"><h3>Confirma la ubicación</h3><div class="inv-sub">Escanea la etiqueta de la ubicación <b>' + escapeHtml(loc) + '</b></div><input class="inv-in big" id="invScan" inputmode="none" autocomplete="off" placeholder="Escanear ubicación + Enter" onkeydown="if(event.key===\'Enter\')invScanEnter(this)"><button class="inv-b" onclick="invLocOk()">Confirmar sin escanear</button></div>';
    return h;
  }
  var cur = invActiva(loc); var mv = invMovesLoc(loc);
  var pend = invPend(loc);
  if(cur || INV_UI.add){
    h += invHtmlCard(cur);
  }
  var hechos = mv.filter(function(m){ return !cur || m.cod !== cur.cod; });
  if(pend.length > 1) h += '<div class="inv-card"><h3>Pendientes en esta ubicación (' + pend.length + ')</h3>' + pend.map(function(a){ return '<div class="inv-row"><span class="inv-cod" style="font-size:13px">' + escapeHtml(a.cod) + '</span><span class="inv-sub" style="flex:1">' + escapeHtml((a.desc || '').slice(0, 50)) + invSmTag(a.cod) + '</span>' + (cur && cur.cod === a.cod ? '<span class="inv-sub">← en curso</span>' : '<button class="inv-b sm" onclick="invElegir(\'' + escapeAttrJs(a.cod) + '\')">Hacer ahora</button>') + '</div>'; }).join('') + '</div>';
  if(hechos.length) h += '<div class="inv-card"><h3>Ya verificados aquí</h3>' + hechos.map(function(m){ return '<div class="inv-row"><span class="inv-cod" style="font-size:13px">' + escapeHtml(m.cod) + '</span><span class="inv-sub" style="flex:1">' + invSmTag(m.cod) + (m.uds > 0 ? m.uds + ' uds ' + (m.palet === INV_QUEDA ? '· se quedan en la ubicación' : '→ ' + escapeHtml(m.palet)) : 'NO ESTÁ (0 uds)') + (m.tipo === 'noreg' ? ' · no registrado' : '') + '</span><button class="inv-b sm" onclick="invDeshacer(\'' + m.id + '\')">↩ Deshacer</button></div>'; }).join('') + '</div>';
  if(INV_UI.nota){ }
  var acab = !pend.length && !INV_UI.add && !(INV_UI.cur && INV_UI.cur.loc === loc);
  h += '<div class="inv-card"><div class="inv-row">';
  if(!INV_UI.add) h += '<button class="inv-b warn" onclick="invAddMode()">➕ Hay un artículo que no figura aquí</button>';
  if(pend.length || (INV_UI.cur && INV_UI.cur.loc === loc)){ if(pend.length) h += '<button class="inv-b sm" onclick="invVacia()">Ubicación vacía (nada de lo anotado está)</button>'; }
  h += '</div>';
  if(!pend.length && !(INV_UI.cur && INV_UI.cur.loc === loc) && !INV_UI.add) h += '<button class="inv-b ok" onclick="invTerminar()">' + (INV.done[loc] ? '▶ Siguiente ubicación' : (mv.length ? '✔ Terminar ubicación y siguiente' : '✔ Ubicación vacía · siguiente')) + '</button>';
  h += '<button class="inv-b sm" onclick="invNav(1)">Saltar (volver luego)</button></div>';
  return h;
}
function invHtmlCard(c){
  var h = '<div class="inv-art act">';
  var addMode = INV_UI.add && !c;
  if(addMode){
    h += '<h3>Artículo que no figura en esta ubicación</h3><div class="inv-sub">Escanea el EAN del artículo (o escribe su código)</div><input class="inv-in big" id="invScan" inputmode="none" autocomplete="off" placeholder="Escanear EAN / código + Enter" onkeydown="if(event.key===\'Enter\')invScanEnter(this)"><div class="inv-row"><button class="inv-b sm" onclick="INV_UI.add=false;invRender()">Cancelar</button></div></div>';
    return h;
  }
  var q = invQtyAqui(c.cod, c.loc), info = invInfo(c.cod);
  var st = c.step;
  h += '<div class="inv-steps"><span class="' + (st === 'ean' ? 'on' : 'ok') + '">① Artículo</span><span class="' + (st === 'uds' ? 'on' : (st === 'palet' || st === 'conf' ? 'ok' : '')) + '">② Unidades</span><span class="' + (st === 'palet' ? 'on' : (st === 'conf' ? 'ok' : '')) + '">③ Palet</span><span class="' + (st === 'conf' ? 'on' : '') + '">④ Confirmar</span></div>';
  h += '<div class="inv-cod">' + escapeHtml(c.cod) + '</div>' + (invSinMov(c.cod) ? '<div class="inv-sm big">⏳ SIN MOVIMIENTO EN 6 MESES</div>' : '') + '<div class="inv-sub">' + escapeHtml(c.desc || '(sin descripción)') + '</div>';
  h += '<div class="inv-sub">' + (c.tipo === 'noreg' ? '<b style="color:#A32D2D">No figura en el sistema en esta ubicación</b>' : 'En el sistema: ' + escapeHtml((invArtsSistema(INV.zona, c.loc).filter(function(a){ return a.cod === c.cod; })[0] || {}).tipoAqui || '') + ' aquí') + (info ? ' · existencias totales del artículo: <b>' + info.exist + '</b>' : '') + (q != null ? ' · anotadas en esta ubicación: <b>' + q + '</b>' : '') + '</div>';
  if(st === 'ean'){
    h += '<div class="inv-sub"><b>Escanea el EAN del artículo</b> (verifica que es el correcto)</div><input class="inv-in big" id="invScan" inputmode="none" autocomplete="off" placeholder="Escanear EAN + Enter" onkeydown="if(event.key===\'Enter\')invScanEnter(this)">';
    h += '<div class="inv-row"><button class="inv-b sm" onclick="invEanManual()">Verificar sin escanear</button><button class="inv-b sm red" onclick="invNoEsta()">No está (0 uds)</button></div>';
  } else if(st === 'uds'){
    h += '<div class="inv-sub"><b>Unidades que hay en la ubicación</b>' + (c.eanOk ? ' · EAN verificado ✓' : ' · EAN no escaneado') + '</div><div class="inv-row"><input class="inv-in big" id="invUds" type="number" min="0" inputmode="numeric" placeholder="Unidades" value="' + (c.uds == null ? '' : c.uds) + '" onkeydown="if(event.key===\'Enter\')invUdsOk()" style="flex:1"><button class="inv-b pri" onclick="invUdsOk()">OK</button></div>';
    if(q != null) h += '<button class="inv-b sm" onclick="document.getElementById(\'invUds\').value=' + q + '">= ' + q + ' (anotadas)</button>';
    h += '<div class="inv-row"><button class="inv-b sm red" onclick="invNoEsta()">No está (0 uds)</button></div>';
  } else if(st === 'palet'){
    h += '<div class="inv-sub"><b>' + c.uds + ' uds.</b> Escanea el código del palet donde las dejas, o elige dejarlas en la ubicación</div><input class="inv-in big" id="invScan" inputmode="none" autocomplete="off" placeholder="Escanear código del palet + Enter" onkeydown="if(event.key===\'Enter\')invScanEnter(this)">';
    var ps = Object.keys(INV.palets).sort();
    h += '<div class="inv-row">' + (INV.curPalet && INV.palets[INV.curPalet] ? '<button class="inv-b sm" onclick="invElegirPalet(\'' + INV.curPalet + '\')">Usar ' + INV.curPalet + ' (el último)</button>' : '') + '<button class="inv-b sm" onclick="invElegirPalet(invNuevoPalet())">+ Palet nuevo</button>' + (ps.length ? '<select class="inv-in" style="font-size:13px;padding:6px" onchange="if(this.value)invElegirPalet(this.value)"><option value="">Otro palet…</option>' + ps.map(function(p){ return '<option>' + p + '</option>'; }).join('') + '</select>' : '') + '</div>';
    h += '<div class="inv-row"><button class="inv-b warn" onclick="invQueda()" style="flex:1">↩ Dejar en la ubicación (no pasa a palet)</button></div>';
    h += '<div class="inv-row"><button class="inv-b sm" onclick="INV_UI.cur.step=\'uds\';invRender()">‹ Cambiar unidades</button></div>';
  } else {
    h += '<div class="inv-msg ok" style="font-size:16px">' + (c.palet === INV_QUEDA ? '<b>' + c.uds + ' uds</b> de <b>' + escapeHtml(c.cod) + '</b> se <b>quedan en la ubicación ' + escapeHtml(c.loc) + '</b> (no pasan a palet)' : 'Dejar <b>' + c.uds + ' uds</b> de <b>' + escapeHtml(c.cod) + '</b> en el palet <b>' + escapeHtml(c.palet) + '</b>') + '</div>';
    h += '<div class="inv-row"><button class="inv-b ok" onclick="invConfirmar()" style="flex:1">✔ Confirmar</button><button class="inv-b" onclick="INV_UI.cur.step=\'palet\';invRender()">Cambiar destino</button></div>';
    h += '<input id="invScan" style="opacity:0;position:absolute;left:-999px" onkeydown="if(event.key===\'Enter\')invConfirmar()">';
  }
  return h + '</div>';
}
function invNav(dir){
  var ls = invLocsGrupo(), i = ls.indexOf(INV.loc); var n = ls[i + dir]; if(!n){ invMsg(dir > 0 ? 'Era la última ubicación de este grupo.' : 'Es la primera ubicación.', 'wa'); invRender(); return; }
  invIr(n);
}
function invElegir(cod){
  var a = invArtsSistema(INV.zona, INV.loc).filter(function(x){ return x.cod === cod; })[0]; if(!a) return;
  INV_UI.cur = { loc:INV.loc, cod:cod, desc:a.desc || invDescDe(cod), tipo:'sistema', step:'ean', eanOk:false, uds:null, palet:null }; INV_UI.add = false; invMsg(null); invRender();
}
function invAddMode(){ INV_UI.cur = null; INV_UI.add = true; invMsg(null); invRender(); }
function invLocOk(){ INV.locOk[INV.loc] = true; invMsg(null); invSave(); invRender(); }
function invEanManual(){ var c = INV_UI.cur; c.step = 'uds'; c.eanOk = false; invMsg('Artículo confirmado sin escanear el EAN.', 'wa'); invRender(); }
function invNoEsta(){
  var c = INV_UI.cur; if(!c) return;
  if(!confirm('¿Confirmas que ' + c.cod + ' NO está en ' + c.loc + '?')) return;
  invPush({ cod:c.cod, desc:c.desc, uds:0, palet:'', tipo:c.tipo, eanOk:false });
  INV_UI.cur = null; invMsg(c.cod + ': marcado como NO está.', 'wa'); invRender();
}
function invVacia(){
  var p = invPend(INV.loc); if(!p.length) return;
  if(!confirm('¿Confirmas que la ubicación está vacía? Los ' + p.length + ' artículos anotados se marcan como NO están.')) return;
  p.forEach(function(a){ invPush({ cod:a.cod, desc:a.desc || invDescDe(a.cod), uds:0, palet:'', tipo:'sistema', eanOk:false }); });
  INV_UI.cur = null; invRender();
}
function invUdsOk(){
  var e = document.getElementById('invUds'); var v = e ? e.value : ''; var n = parseInt(String(v).replace(',', '.'), 10);
  if(!(n >= 0)){ invMsg('Escribe las unidades (0 o más).', 'err'); invRender(); return; }
  var c = INV_UI.cur; c.uds = n;
  if(n === 0){ invPush({ cod:c.cod, desc:c.desc, uds:0, palet:'', tipo:c.tipo, eanOk:c.eanOk }); INV_UI.cur = null; invMsg(c.cod + ': 0 uds registradas (no está).', 'wa'); invRender(); return; }
  c.step = 'palet'; invMsg(null); invRender();
}
var INV_QUEDA = 'EN UBICACIÓN';
function invQueda(){ var c = INV_UI.cur; if(!c) return; c.palet = INV_QUEDA; c.step = 'conf'; invMsg(null); invRender(); }
function invElegirPalet(p){ var c = INV_UI.cur; c.palet = p; c.step = 'conf'; invMsg(null); invRender(); }
function invPush(m){
  m.id = 'm' + Date.now() + Math.floor(Math.random() * 1000); m.ts = new Date().toISOString(); m.oper = INV.oper; m.zona = INV.zona; m.loc = INV.loc;
  INV.moves.push(m); invSave();
}
function invConfirmar(){
  var c = INV_UI.cur; if(!c || c.step !== 'conf') return;
  var queda = c.palet === INV_QUEDA;
  if(!queda){ if(!INV.palets[c.palet]) INV.palets[c.palet] = { creado:new Date().toISOString(), oper:INV.oper }; INV.curPalet = c.palet; }
  invPush({ cod:c.cod, desc:c.desc, uds:c.uds, palet:c.palet, tipo:c.tipo, eanOk:c.eanOk });
  INV_UI.cur = null; INV_UI.add = false; invMsg(queda ? c.uds + ' uds de ' + c.cod + ' se quedan en ' + c.loc + '.' : c.uds + ' uds de ' + c.cod + ' dejadas en ' + c.palet + '.', 'ok'); invRender();
}
function invDeshacer(id){
  if(!confirm('¿Deshacer este movimiento?')) return;
  INV.moves = INV.moves.filter(function(m){ return m.id !== id; }); delete INV.done[INV.loc]; invSave(); INV_UI.cur = null; invMsg('Movimiento deshecho.', 'wa'); invRender();
}
function invTerminar(){
  INV.done[INV.loc] = { ts:new Date().toISOString(), oper:INV.oper, vacia:!invMovesLoc(INV.loc).length }; invSave();
  var ls = invLocsGrupo(), i = ls.indexOf(INV.loc); var sig = ls.slice(i + 1).filter(function(l){ return !INV.done[l]; })[0] || ls.filter(function(l){ return !INV.done[l]; })[0];
  if(sig){ invIr(sig); return; }
  INV.view = 'setup'; invMsg('Grupo ' + invGrupoLbl(INV.zona, INV.grupo) + ' terminado. Elige otra letra o descarga el Excel.', 'ok'); invRender();
}
function invScanEnter(inp){
  var v = inp.value.trim(); inp.value = ''; if(!v) return;
  var loc = INV.loc;
  if(!INV.locOk[loc]){
    if(invNorm(v) === invNorm(loc)){ INV.locOk[loc] = true; invMsg(null); invSave(); invRender(); }
    else { invMsg('Ubicación leída: ' + v + '. Debe ser ' + loc + '.', 'err'); invRender(); }
    return;
  }
  if(INV_UI.add && !INV_UI.cur){
    var cod = invResolver(v);

  r += '<text x="' + W / 2 + '" y="' + ty + '" font-size="' + fs.toFixed(1) + '" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">' + escapeHtml(code) + '</text>';
  var w = o.rot ? H : W, h = o.rot ? W : H;
  var inner = o.rot ? '<g transform="translate(' + H + ',0) rotate(90)">' + r + '</g>' : r;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w / 10 + 'mm" height="' + h / 10 + 'mm" viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges">' + inner + '</svg>';
}
var INV_PRESETS = [
  { k:'ubi', n:'Etiqueta de ubicación · 54 × 44 mm (EXT-54x44-01P)', W:54, H:44, M:2 },
  { k:'art', n:'Etiqueta de artículo / estancia · 150 × 80 mm', W:150, H:80, M:4 },
  { k:'a4', n:'Cartel de palet · A4 apaisado 297 × 210 mm', W:297, H:210, M:10 }
];
function invPresetDe(o){ var p = INV_PRESETS.filter(function(x){ return x.W === o.W && x.H === o.H; })[0]; return p ? p.k : 'custom'; }
function invPresetSet(k){
  var p = INV_PRESETS.filter(function(x){ return x.k === k; })[0]; if(!p) return;
  INV.lab.W = p.W; INV.lab.H = p.H; INV.lab.M = p.M; invSave(); invRender();
}
function invLabCfg(){
  var g = function(id, d, mn){ var e = document.getElementById(id); var v = e ? parseFloat(String(e.value).replace(',', '.')) : NaN; return v >= mn ? v : d; };
  if(document.getElementById('lbW')){ INV.lab.W = g('lbW', 54, 20); INV.lab.H = g('lbH', 44, 15); INV.lab.M = g('lbM', 2, 0); INV.lab.rot = document.getElementById('lbR').value === '90'; }
  invSave();
}
function invHtmlEtiq(){
  var o = INV.lab, ps = Object.keys(INV.palets).sort();
  var h = invMsgHtml() + '<div class="inv-card"><h3>Etiquetas de palet</h3><div class="inv-sub">Código de barras Code 128 con el código del palet (' + escapeHtml(INV.pref) + '-0001…), el mismo tipo que ya lee bien la PDA. Una etiqueta por página.</div>';
  h += '<div class="inv-row"><label class="inv-sub" style="flex:1;min-width:220px">Tamaño de etiqueta <select class="inv-in" style="width:100%;font-size:14px;padding:8px" onchange="invPresetSet(this.value)">' + INV_PRESETS.map(function(p){ return '<option value="' + p.k + '"' + (invPresetDe(o) === p.k ? ' selected' : '') + '>' + escapeHtml(p.n) + '</option>'; }).join('') + '<option value="custom"' + (invPresetDe(o) === 'custom' ? ' selected' : '') + ' disabled>Personalizado (medidas de abajo)</option></select></label></div>\n'
  h += '<div class="inv-row"><label class="inv-sub">Largo (mm) <input class="inv-in" id="lbW" type="number" step="0.5" style="width:72px;font-size:14px;padding:6px" value="' + o.W + '" onchange="invLabCfg();invRender()"></label><label class="inv-sub">Alto (mm) <input class="inv-in" id="lbH" type="number" step="0.5" style="width:72px;font-size:14px;padding:6px" value="' + o.H + '" onchange="invLabCfg();invRender()"></label><label class="inv-sub">Margen <input class="inv-in" id="lbM" type="number" step="0.5" style="width:64px;font-size:14px;padding:6px" value="' + o.M + '" onchange="invLabCfg();invRender()"></label><label class="inv-sub">Giro <select class="inv-in" id="lbR" style="font-size:14px;padding:6px" onchange="invLabCfg();invRender()"><option value="0"' + (o.rot ? '' : ' selected') + '>No</option><option value="90"' + (o.rot ? ' selected' : '') + '>90°</option></select></label></div>';
  var pv = ps[0] || (INV.pref + '-' + invPad(INV.next));
  h += '<div class="inv-sub">Vista previa (' + escapeHtml(pv) + ') · tamaño de la etiqueta ' + o.W + ' × ' + o.H + ' mm</div><div style="border:1px dashed var(--border2);display:block;width:' + Math.min(100, Math.round((o.rot ? o.H : o.W) * 3.2)) + 'px;max-width:100%;align-self:flex-start;background:#fff">' + invLabSvg(pv).replace(/width="[0-9.]+mm" height="[0-9.]+mm"/, 'style="width:100%;height:auto;display:block"') + '</div></div>';
  h += '<div class="inv-card"><h3>Crear palets nuevos e imprimir</h3><div class="inv-row"><label class="inv-sub">Cantidad <input class="inv-in" id="lbN" type="number" min="1" max="200" value="10" style="width:80px;font-size:16px;padding:6px"></label><button class="inv-b ok" onclick="invImprimirNuevos()">🖨 Crear e imprimir (desde ' + escapeHtml(INV.pref) + '-' + invPad(INV.next) + ')</button></div><div class="inv-sub">Los palets creados quedan registrados y listos para escanear. Si necesitas repetir una etiqueta, usa la lista de abajo.</div></div>';
  h += '<div class="inv-card"><h3>Reimprimir palets existentes (' + ps.length + ')</h3>' + (ps.length ? '<div class="inv-row"><button class="inv-b" onclick="invImprimir(Object.keys(INV.palets).sort())">🖨 Imprimir todos</button><button class="inv-b sm" onclick="invImprimir([Object.keys(INV.palets).sort()[0]])">Etiqueta de prueba</button></div><div class="inv-row">' + ps.map(function(p){ return '<button class="inv-chip" style="padding:5px 9px;font-size:12px" onclick="invImprimir([\'' + p + '\'])">🖨 ' + p + '</button>'; }).join('') + '</div>' : '<div class="inv-sub">Todavía no hay palets.</div>') + '</div>';
  h += '<div class="inv-card"><div class="inv-sub">Al imprimir: papel del tamaño de la etiqueta (' + o.W + ' × ' + o.H + ' mm), sin márgenes y escala 100 %.</div></div>';
  return h;
}
function invImprimirNuevos(){
  var n = parseInt(document.getElementById('lbN').value, 10); if(!(n >= 1 && n <= 200)){ invMsg('Cantidad entre 1 y 200.', 'err'); invRender(); return; }
  invLabCfg(); var cs = []; for(var i = 0; i < n; i++) cs.push(invNuevoPalet());
  invImprimir(cs);
}
function invImprimir(cs){
  if(!cs.length || !cs[0]){ return; } invLabCfg();
  var o = INV.lab, w = o.rot ? o.H : o.W, h = o.rot ? o.W : o.H;
  var st = document.getElementById('invPgStyle'); if(!st){ st = document.createElement('style'); st.id = 'invPgStyle'; document.head.appendChild(st); }
  st.textContent = '@media print{@page{size:' + w + 'mm ' + h + 'mm;margin:0}#invPrt .pg{width:' + w + 'mm;height:' + h + 'mm}}';
  var d = document.getElementById('invPrt'); d.innerHTML = cs.map(function(c){ return '<div class="pg">' + invLabSvg(c) + '</div>'; }).join('');
  document.documentElement.classList.add('inv-printing'); document.body.classList.add('inv-printing');
  var fin = function(){ document.documentElement.classList.remove('inv-printing'); document.body.classList.remove('inv-printing'); window.removeEventListener('afterprint', fin); };
  window.addEventListener('afterprint', fin);
  setTimeout(function(){ window.print(); setTimeout(fin, 1500); }, 60);
}

invLoad(); invBadge();

invOpen();
